<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


</head>
<body>
    <button id="rock">rock</button>
    <button id="paper">paper</button>
    <button id="scissors">scissors</button>
</body>
    <script>
        let humanScore = 0;
        let compScore = 0;

        function playRound(humanChoice, computerChoice) {
            if(humanChoice == "rock"){
                if (computerChoice == "paper"){
                    compScore += 1;
                    return "You lose! Paper beats rock!";
                }
                else if(computerChoice == "scissors"){
                    humanScore += 1;
                    return "You win! Rock beats Scissors";
                }
                else{
                    return "no winner";
                }
            }
            else if(humanChoice =="paper"){
                if(computerChoice == "scissors"){
                    compScore += 1;
                    return "You lose! Scissors beats paper";
                }
                else if(computerChoice == "rock"){
                    humanScore += 1;
                    return "You win! Paper beats rock!";
                }
                else{
                    return "no winner";
                }
            }
            else if (humanChoice == "scissors"){
                if(computerChoice == "rock"){
                    compScore += 1;
                    return "You lose! Rock beats scissors!";
                }
                else if(computerChoice == "paper"){
                    humanScore += 1;
                    return "You win! Paper beats scissors!";
                }
                else{
                    return "no winners";
                }
            }
        }
        function getHumanChoice(){
            let choice = prompt("What choice are you going to make?");
            choice = choice.toLowerCase();
            return choice;
        }
        function getComputerChoice(){
            let compchoice = Math.random();
            compchoice = compchoice * 100;

            if (compchoice <= 33){
                compchoice = "rock";
            }
            else if (compchoice > 33 && compchoice <= 66){
                compchoice = "scissor";
            }
            else{
                compchoice = "paper";
            }
            return compchoice;

        }

        const rockbtn = document.getElementById("rock");

        const paperbtn = document.getElementById("paper")

        const scissorsbtn = document.getElementById("scissors")

        function scoreChecker(){
            if (humanScore == 5 || compScore == 5){
                if(humanScore == 5){
                    let decision = " you are the winner!"
                    humanScore = 0;
                    compScore = 0;
                    return decision;
                }
                else if(compScore == 5){
                    let decision = " computer wins!"
                    humanScore = 0;
                    compScore = 0;
                    return decision;
                }
            }
            else{
                return "";
            }
        };
        rockbtn.addEventListener("click", (e) => {
            let decision = playRound("rock", getComputerChoice());
            const rockdiv= document.createElement("div"); 
            rockdiv.textContent = decision + " " + humanScore +" " + compScore;

            rockdiv.textContent += scoreChecker();

            document.body.appendChild(rockdiv);
        } );

        paperbtn.addEventListener("click", (e) => {
            let decision = playRound("paper", getComputerChoice());
            const paperdiv = document.createElement("div"); 
            paperdiv.textContent = decision + " " + humanScore + " " + compScore;
            paperdiv.textContent += scoreChecker();

            document.body.appendChild(paperdiv);
        });
        scissorsbtn.addEventListener("click", (e) => {
            let decision = playRound("scissors", getComputerChoice());
            const scissorsdiv = document.createElement("div"); 
            scissorsdiv.textContent = decision + " " + humanScore + " " + compScore;

            scissorsdiv.textContent += scoreChecker();

            document.body.appendChild(scissorsdiv);
        })
    </script>
</html>
